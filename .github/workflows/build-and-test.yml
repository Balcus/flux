name: build-and-test
on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  app-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/client/desktop-app
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: crates/client/desktop-app/pnpm-lock.yaml
      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript Type Check
        run: pnpm exec tsc --noEmit

  rust-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            libprotobuf-dev \
            build-essential
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build Core Workspace
        run: cargo build --workspace --exclude desktop-app
      - name: Run Rust Tests
        run: cargo test --workspace --exclude desktop-app

  tauri-check:
    runs-on: ubuntu-24.04
    needs: [app-check, rust-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler \
            libprotobuf-dev \
            build-essential
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: crates/client/desktop-app/pnpm-lock.yaml
      - name: Install Frontend Dependencies
        working-directory: crates/client/desktop-app
        run: pnpm install --frozen-lockfile
      - name: Check Tauri App
        working-directory: crates/client/desktop-app
        run: pnpm tauri build --no-bundle
